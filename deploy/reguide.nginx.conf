# Included inside nasserdiary.com's existing HTTPS server block.
location = /reguide {
    return 308 /reguide/;
}

location ^~ /reguide/api/ {
    proxy_pass http://127.0.0.1:8125/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /reguide/assets/ {
    alias /home/nasser/apps/reguide/frontend/dist/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location /reguide/ {
    alias /home/nasser/apps/reguide/frontend/dist/;
    try_files $uri $uri/ /reguide/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}
